name: Validate Docker Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: docker-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha,scope=bcordes-docker
          cache-to: type=gha,scope=bcordes-docker,mode=max
          platforms: linux/amd64
          tags: bcordes:ci-${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/bcordes-image.tar
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Upload the built image
        uses: actions/upload-artifact@v4
        with:
          name: bcordes-image-${{ github.sha }}
          path: ${{ runner.temp }}/bcordes-image.tar
          compression-level: 0
          retention-days: 1

  runtime:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the built image
        uses: actions/download-artifact@v4
        with:
          name: bcordes-image-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Load the built image
        run: docker load --input "$RUNNER_TEMP/bcordes-image.tar"

      - name: Verify production container and assets
        run: bash scripts/verify-docker.sh --image "$VERIFY_IMAGE"
        env:
          VERIFY_IMAGE: bcordes:ci-${{ github.sha }}
