name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['apps/web--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/web--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout the released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Parse semver from tag
        id: semver
        run: bash scripts/release-tag-outputs.sh "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Promote the released revision by digest
        run: |
          SOURCE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse HEAD)"
          # CI publishes this exact revision. A mutable nightly is never a fallback.
          for attempt in $(seq 1 30); do
            DIGEST="$(crane digest "$SOURCE_IMAGE" 2>/dev/null)" && break
            sleep 30
          done
          test -n "$DIGEST"
          SRC="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$DIGEST"
          DST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          crane copy "$SRC" "$DST:latest"
          crane copy "$SRC" "$DST:${{ steps.semver.outputs.version }}"
          crane copy "$SRC" "$DST:${{ steps.semver.outputs.minor }}"
          crane copy "$SRC" "$DST:${{ steps.semver.outputs.major }}"
          echo "Promoted $SRC to latest, ${{ steps.semver.outputs.version }}, ${{ steps.semver.outputs.minor }}, ${{ steps.semver.outputs.major }}"
